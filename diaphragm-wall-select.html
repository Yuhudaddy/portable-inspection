<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="連續壁檢查表：選擇品管版或完整版" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Portable Inspection" />
    <link rel="icon" href="./app-icon-144.png" type="image/png" sizes="144x144" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./glass.css" />
    <link rel="stylesheet" href="./portal.css" />
    <script src="./portal.js" defer></script>
    <script src="./sw-client.js" defer></script>
    <title>連續壁｜Portable Inspection</title>
  </head>
  <body>
    <a class="skip-link" href="#version-index">跳至版本選擇</a>

    <header class="app-header">
      <nav class="header-nav" aria-label="主要功能">
        <a class="glass-pill header-back" href="./" aria-label="返回工具首頁"><svg width="10" height="16" viewBox="0 0 12 20" fill="none" aria-hidden="true"><path d="M10 2L2 10l8 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>工具</a>
      </nav>
    </header>

    <main class="portal-shell is-sub">
      <div class="select-heading">
        <p>DIAPHRAGM WALL</p>
        <h1>連續壁</h1>
      </div>

      <!-- 兩個版本是各自獨立的工具：草稿、JSON、施工計畫都分開存，只共用這個入口 -->
      <section class="tool-index version-index" id="version-index" aria-label="選擇連續壁檢查表版本">
        <a class="tool-card tool-card-active" href="./diaphragm-wall-gc">
          <span class="version-tag">QUALITY CONTROL</span>
          <span class="tool-card-copy">
            <strong>品管版</strong>
            <small>適合營造品管用</small>
          </span>
        </a>

        <a class="tool-card tool-card-active" href="./diaphragm-wall">
          <span class="version-tag">FULL RECORD</span>
          <span class="tool-card-copy">
            <strong>完整版</strong>
            <small>適合廠商自檢用</small>
          </span>
        </a>
      </section>
    </main>
  </body>
</html>
